[workspace]
resolver = "3"
members = [
  "src/foundation/algorithm",
  "src/foundation/command-line",
  "src/foundation/filesystem",
  "src/localization/languages",
  "src/migration/pipeline",
  "src/migration/manifest",
  "src/migration/source-audit",
  "src/foundation/json-text",
  "src/foundation/sha256",
  "src/formats/fbx",
  "src/formats/p3d",
  "src/formats/rcf",
  "src/formats/rsd",
  "src/formats/rmv",
  "src/formats/rtf",
  "src/unreal/asset-conversion",
]

[workspace.package]
version = "26.7.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.lints.rust]
# Compiler warnings are binary failures. Unsafe Rust is categorically outside
# Jig's implementation contract.
warnings = "deny"
unsafe_code = "forbid"

# Explicit language, lifetime, visibility, migration, and dead-surface checks.
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deprecated_in_future = "deny"
deprecated_safe_2024 = "deny"
deref_into_dyn_supertrait = "deny"
edition_2024_expr_fragment_specifier = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
keyword_idents = { level = "deny", priority = -1 }
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
rust_2021_prefixes_incompatible_syntax = "deny"
rust_2021_prelude_collisions = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
single_use_lifetimes = "deny"
tail_expr_drop_order = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_crate_dependencies = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"
unused_results = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
unnecessary_trailing_comma = "allow"
too_many_lines = "allow"
suboptimal_flops = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
assigning_clones = "allow"
semicolon_if_nothing_returned = "allow"
# Broad families stay below named rules so an individually selected invariant
# always wins if upstream group membership changes.
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Restriction lints are selected individually. The full restriction group is not
# enabled because it intentionally contains contradictory policies.
absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
cfg_not_test = "deny"
cognitive_complexity = "allow"
create_dir = "deny"
dbg_macro = "deny"
default_numeric_fallback = "allow"
default_union_representation = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "allow"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
host_endian_bytes = "deny"
exit = "deny"
lossy_float_literal = "deny"
pointer_format = "deny"
impl_trait_in_params = "allow"
renamed_function_params = "allow"
indexing_slicing = "deny"
multiple_inherent_impl = "allow"
non_zero_suggestions = "deny"
inline_trait_bounds = "allow"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "allow"
infinite_loop = "deny"
rest_pat_in_fully_bound_structs = "deny"
try_err = "deny"
wildcard_enum_match_arm = "allow"
clone_on_ref_ptr = "deny"
expect_used = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
string_lit_chars_any = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
min_ident_chars = "allow"
self_named_module_files = "allow"
semicolon_inside_block = "deny"
separated_literal_suffix = "allow"
unneeded_field_pattern = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "allow"
missing_trait_methods = "allow"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
arithmetic_side_effects = "deny"
float_cmp = "allow"
float_cmp_const = "deny"
integer_division = "deny"
integer_division_remainder_used = "allow"
modulo_arithmetic = "deny"
panic_in_result_fn = "allow"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
partial_pub_fields = "allow"
pathbuf_init_then_push = "deny"
precedence_bits = "deny"
needless_raw_strings = "deny"
deref_by_slicing = "deny"
ref_patterns = "deny"
redundant_test_prefix = "deny"
same_name_method = "deny"
shadow_reuse = "allow"
shadow_same = "deny"
shadow_unrelated = "allow"
single_char_lifetime_names = "allow"
str_to_string = "deny"
string_add = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
unnecessary_safety_comment = "deny"
non_ascii_literal = "allow"
unnecessary_self_imports = "deny"
unused_result_ok = "deny"
unused_trait_names = "allow"
unwrap_in_result = "deny"
pub_without_shorthand = "deny"
print_stderr = "deny"
print_stdout = "deny"
use_debug = "deny"
