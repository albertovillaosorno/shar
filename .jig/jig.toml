[analysis]
cache = "bounded"
full_workspace = true
incremental = true

[code_ownership]
default = "authored-production"
exact_languages = []

[code_ownership.override.generated_lock]
authority = "cargo"
kind = "generated"
selectors = ["exact:Cargo.lock"]

[code_ownership.override.generated_game_manifest]
authority = "generate-manifest"
kind = "generated"
selectors = ["exact:game/manifest/game.jsonl"]

[code_ownership.override.generated_jig_catalogs]
authority = "jig"
kind = "generated"
selectors = ["exact:.jig/cspell/cspell.json", "exact:.jig/taxonomy.json"]

[code_ownership.override.generated_jig_sidecars]
authority = "jig"
kind = "generated"
# jig-ignore-next-line: complete generated sidecar basename inventory
selectors = ["basename:Cargo.toml.yml", "basename:README.md.yml", "basename:lib.rs.yml"]

[code_ownership.override.generated_unreal_mcp_skills]
authority = "unreal-mcp-skill-export"
kind = "generated"
# jig-ignore-next-line: generated index plus generated capability subtree
selectors = ["exact:skills/unreal/index.md", "prefix:skills/unreal/capabilities/"]

[code_ownership.override.generated_unreal_test_fixtures]
authority = "repository-fixture-builders"
kind = "generated"
selectors = ["prefix:tests/fixtures/"]

[code_ownership.override.generated_p3d_fixtures]
authority = "p3d-fixture-builder"
kind = "generated"
selectors = ["prefix:tests/formats/p3d/fixtures/"]

[code_ownership.override.tests]
kind = "test"
# jig-ignore-next-line: executable test roots exclude generated fixture trees
selectors = ["prefix:tests/formats/fbx/", "prefix:tests/formats/lmlm/", "prefix:tests/formats/p3d/unit/", "exact:tests/formats/p3d/chunk.rs", "exact:tests/formats/p3d/extract.rs", "exact:tests/formats/p3d/package.rs", "exact:tests/formats/p3d/reader.rs", "prefix:tests/formats/rcf/", "prefix:tests/formats/rmv/", "prefix:tests/formats/rsd/", "prefix:tests/formats/rtf/", "prefix:tests/foundation/", "prefix:tests/migration/", "prefix:tests/unreal/"]

[commit]
allowed_scopes = ["docs", "game-manifest", "jig", "layout", "pipeline", "repo"]
allowed_trailers = ["BREAKING CHANGE"]
# jig-ignore-next-line: complete Conventional Commit type vocabulary
allowed_types = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "release", "revert", "style", "test"]
allow_merge_commits = false
allow_revert_type = true
body_line_max_length = 80
body_min_length = 1
history_baseline = "ad1be1227c09d9d9e8d4257264cc31872996209a"
required_trailers = []
require_scope = true
subject_max_length = 72

[contribution]
exact_form = true
private_authoritative_review = true

[git]
required_hooks = ["commit-msg"]
required_ignored_paths = []

[git_attributes]
# jig-ignore-next-line: exact binary publication extension inventory
binary_extensions = ["7z", "a", "bmp", "dll", "dylib", "exe", "fbx", "gif", "gz", "ico", "jpeg", "jpg", "lib", "pdf", "png", "so", "uasset", "umap", "webp", "zip"]
