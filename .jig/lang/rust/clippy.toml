# Clippy configuration is intentionally machine-oriented. Thresholds are lower
# than upstream defaults to force small, explicit units before complexity grows.
msrv = "1.97.1"
avoid-breaking-exported-api = false
check-inconsistent-struct-field-initializers = true
lint-commented-code = true

# Test and const code obey the same panic/index/debug discipline as production.
allow-dbg-in-tests = false
allow-expect-in-consts = false
allow-expect-in-tests = false
allow-indexing-slicing-in-tests = false
allow-panic-in-tests = false
allow-print-in-tests = false
allow-unwrap-in-consts = false
allow-unwrap-in-tests = false
allow-mixed-uninlined-format-args = false
allow-one-hash-in-raw-strings = false
allow-private-module-inception = false
allow-comparison-to-zero = false

# Complexity and representation budgets are explicit rather than inherited from
# future Clippy defaults.
cognitive-complexity-threshold = 10
excessive-nesting-threshold = 4
too-many-arguments-threshold = 4
too-many-lines-threshold = 60
type-complexity-threshold = 100
enum-variant-size-threshold = 128
large-error-threshold = 64
pass-by-value-size-limit = 128
stack-size-threshold = 65536
array-size-threshold = 8192
future-size-threshold = 8192
vec-box-size-threshold = 2048
min-ident-chars-threshold = 1
single-char-binding-names-threshold = 1
semicolon-inside-block-ignore-singleline = false

# Identifiers are ASCII by rustc policy; keeping the script list explicit makes
# Clippy fail closed if that compiler policy is ever relaxed.
allowed-scripts = ["Latin"]
