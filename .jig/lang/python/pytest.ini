[pytest]
minversion = 9.0
addopts =
    -ra
    --strict-config
    --strict-markers
    --import-mode=importlib
    --tb=short
    --color=no
    --code-highlight=no
pythonpath =
    ../../../src/unreal/editor-control/domain
    ../../../src/unreal/editor-control/application
    ../../../src/unreal/editor-control/port-outbound
    ../../../src/unreal/editor-control/adapter-inbound
    ../../../src/unreal/editor-control/adapter-outbound
    ../../../src/unreal/project/composition/uproject
    ../../../tests/unreal/editor-control
cache_dir = ../../../.cache/pytest
console_output_style = classic
empty_parameter_set_mark = fail_at_collect
filterwarnings =
    error
norecursedirs =
    ../../../.cache
    ../../../.dependencies
    ../../../.git
    ../../../.temp
    ../../../target
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    ../../../tests/architecture
    ../../../tests/packaging
    ../../../tests/unreal/editor-control
    ../../../tests/unreal/project
    ../../../tests/user
xfail_strict = true
