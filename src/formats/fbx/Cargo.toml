[package]
name = "fbx"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Exports decoded assets to native FBX."
publish = false

[lib]
name = "fbx"
path = "composition/lib.rs"

[[bin]]
name = "semantic-character-texture"
path = "composition/semantic_character_texture_cli.rs"

[dependencies]
# shar_sha256 owns the dependency-free repository SHA-256 primitive.
shar_sha256 = { path = "../../foundation/sha256" }
# jig-ignore-next-line: exact value is indivisible
# schoenwald_filesystem centralizes complete UTF-8 reads and directory creation while FBX create-new writes and texture copies remain adapter-specific.
schoenwald_filesystem = { path = "../../foundation/filesystem" }
# serde is retained because the exporter needs typed JSON decoding for
# generated manifests, and a hand-rolled replacement would raise parser risk
# without improving ownership or auditability.
serde = { version = "1", features = ["derive"] }
# serde_json is retained with serde because the input contracts are JSON and the
# crate is a widely reviewed implementation for strict structured decoding.
serde_json = "1"
# png provides pure-Rust, bounded PNG decoding and encoding for deterministic
# semantic texture preparation without external authoring applications.
png = "0.18"
# Canonical external integration tests.

