[package]
name = "lmlm"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Extracts the Jebano Latino LSPA archive to a folder."
publish = false

[dependencies]
# jig-ignore-next-line: exact value is indivisible
# schoenwald_cli centralizes process arguments, ordered diagnostics, newline handling, and exit-code mapping for the LMLM driving adapter.
schoenwald_cli = { path = "../../foundation/command-line" }
# jig-ignore-next-line: exact value is indivisible
# schoenwald_filesystem centralizes complete local archive reads while LMLM-specific collision and create-new publication remain local.
schoenwald_filesystem = { path = "../../foundation/filesystem" }


[lib]
name = "lmlm"
path = "composition/lib.rs"

[[bin]]
name = "lmlm-extract"
path = "composition/main.rs"
# Canonical external integration tests.

[[test]]
name = "cli_run_error"
path = "../../../tests/formats/lmlm/cli_run_error.rs"

[[test]]
name = "extract_archive_error"
path = "../../../tests/formats/lmlm/extract_archive_error.rs"

[[test]]
name = "filesystem_entry_sink"
path = "../../../tests/formats/lmlm/filesystem_entry_sink.rs"

[lints]
workspace = true
