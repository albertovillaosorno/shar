[package]
name = "schoenwald_filesystem"
version.workspace = true
edition = "2024"
license = "MIT"
# jig-ignore-next-line: exact value is indivisible
description = "Hexagonal local filesystem mechanisms shared by Schoenwald crates."
publish = false

[dependencies]

[lib]
name = "schoenwald_filesystem"
path = "composition/lib.rs"
