[package]
name = "game_manifest"
version.workspace = true
edition = "2024"
license = "MIT"
# jig-ignore-next-line: exact value is indivisible
description = "Generates and validates the game/ content manifest for the pipeline."
publish = false

[dependencies]
# jig-ignore-next-line: exact value is indivisible
# schoenwald_cli centralizes process arguments, ordered streams, newline handling, and exit-code mapping for manifest driving adapters.
schoenwald_cli = { path = "../../foundation/command-line" }
# jig-ignore-next-line: exact value is indivisible
# schoenwald_filesystem centralizes deterministic traversal, path inspection, and complete UTF-8 artifact reads and writes.
schoenwald_filesystem = { path = "../../foundation/filesystem" }


[lib]
name = "game_manifest"
path = "composition/lib.rs"

[[bin]]
name = "validate-game"
path = "composition/bin/validate.rs"

[[bin]]
name = "generate-manifest"
path = "composition/bin/generate.rs"

[[bin]]
name = "generate-expanded-manifest"
path = "composition/bin/generate_expanded.rs"

[[bin]]
name = "ephemeral_structural_audit"
path = "composition/bin/ephemeral_structural_audit.rs"
# Canonical external integration tests.

