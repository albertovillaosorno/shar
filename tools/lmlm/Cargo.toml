[package]
name = "shar_lmlm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Standalone SHAR converter for supported legacy LMLM mods."
publish = false

[dependencies]
p3d = { path = "../../src/formats/p3d" }
schoenwald_cli = { path = "../../src/foundation/command-line" }
schoenwald_filesystem = { path = "../../src/foundation/filesystem" }
shar_sha256 = { path = "../../src/foundation/sha256" }
shar_mod_package = { path = "../../src/modding/package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[lib]
name = "shar_lmlm"
path = "composition/lib.rs"

[[bin]]
name = "shar-lmlm"
path = "composition/main.rs"

[[test]]
name = "converter"
path = "../../tests/tools/lmlm/converter.rs"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
